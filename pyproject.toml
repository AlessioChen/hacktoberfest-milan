[project]
name = "frigo"
version = "0.1.0"
description = "Tracker locale del cibo in frigo con Gemma 4 (Ollama)"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "pydantic>=2.8",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pillow>=10.4",
    "pandas>=2.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
